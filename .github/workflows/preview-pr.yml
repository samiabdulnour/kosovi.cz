# Preview per pull request: https://<owner>.github.io/<repo>/pr-preview/pr-<number>/
# The link appears in a comment on the PR. Closing the PR removes the preview.
name: Náhled PR

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      SITE_URL: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
      PUBLIC_PREVIEW_LABEL: 'PR #${{ github.event.number }} · ${{ github.head_ref }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event.action != 'closed'
        with:
          node-version-file: .node-version
          cache: npm

      - if: github.event.action != 'closed'
        run: npm ci
      - if: github.event.action != 'closed'
        run: npx astro check
      - if: github.event.action != 'closed'
        run: npm run build

      - uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: dist
          # The default QR code is generated by a third-party service.
          qr-code: 'false'
